services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: filevault
      POSTGRES_USER: filevault
      POSTGRES_PASSWORD: filevault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U filevault -d filevault"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
